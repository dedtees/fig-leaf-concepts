<!doctype html><html><head><link rel="stylesheet" href="base.css"><style>
.leaf{position:absolute;left:270px;top:5px;width:780px;transform:rotate(-8deg);filter:drop-shadow(0 40px 40px rgba(0,0,0,.7)) brightness(.72) saturate(1.05)}
.glow{position:absolute;left:300px;top:60px;width:700px;height:600px;background:radial-gradient(ellipse at center, rgba(232,194,126,.22), rgba(232,194,126,0) 65%)}
.ac{position:absolute;top:225px;width:290px;height:430px;border-radius:145px 145px 18px 18px;overflow:hidden;background-size:cover;
 box-shadow:0 0 0 2px rgba(232,194,126,.9),0 0 0 7px rgba(7,13,15,.55),0 34px 44px rgba(0,0,0,.65)}
.ac::after{content:"";position:absolute;inset:0;background:linear-gradient(170deg, rgba(255,226,170,.16), rgba(255,226,170,0) 40%, rgba(0,0,0,.28))}
.c1{left:193px;background-image:url(car.jpg);background-position:66% 50%;transform:rotate(-4deg) translateY(18px)}

<div class="floor"></div><div class="glow"></div>

</div></body></html>
